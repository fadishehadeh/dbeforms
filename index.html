<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dukhan Bank - E-Forms</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Tahoma, Arial, sans-serif;
        background: #f2f4f8;
        color: #24366F;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
    }
    .logo {
        height: 60px;
        margin-bottom: 20px;
    }
    h1 {
        font-size: 24px;
        margin: 0 0 6px 0;
        text-align: center;
    }
    p.subtitle {
        margin: 0 0 36px 0;
        color: #55647a;
        text-align: center;
        font-size: 14px;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 20px;
        width: 100%;
        max-width: 700px;
    }
    a.card {
        display: block;
        text-decoration: none;
        background: #ffffff;
        border: 1px solid #dde3ee;
        border-radius: 10px;
        padding: 24px 20px;
        text-align: center;
        color: #24366F;
        box-shadow: 0 2px 6px rgba(36,54,111,0.08);
        transition: box-shadow 0.15s ease, transform 0.15s ease;
    }
    a.card:hover {
        box-shadow: 0 6px 16px rgba(36,54,111,0.18);
        transform: translateY(-2px);
    }
    .card .badge {
        display: inline-block;
        font-size: 11px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        background: #24366F;
        color: #fff;
        border-radius: 4px;
        padding: 3px 8px;
        margin-bottom: 10px;
    }
    .card h2 {
        font-size: 17px;
        margin: 0 0 4px 0;
    }
    .card p {
        font-size: 13px;
        color: #6b7488;
        margin: 0;
    }
    footer {
        margin-top: 40px;
        font-size: 12px;
        color: #9aa4b6;
        text-align: center;
    }
    @media (max-width: 520px) {
        .grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

    <img class="logo" src="images/logo.png" alt="Dukhan Bank">
    <h1>Funds Transfer / Electronic Payment</h1>
    <p class="subtitle">Select a form to continue</p>

    <div class="grid">
        <a class="card" href="index2.html">
            <span class="badge">English</span>
            <h2>Corporate</h2>
            <p>Funds Transfer &ndash; Corporate</p>
        </a>
        <a class="card" href="index2_individual.html">
            <span class="badge">English</span>
            <h2>Individual</h2>
            <p>Funds Transfer &ndash; Individual</p>
        </a>
        <a class="card" href="index2ar.html" dir="rtl">
            <span class="badge">عربي</span>
            <h2>الشركات</h2>
            <p>تحويل الأموال &ndash; الشركات</p>
        </a>
        <a class="card" href="index2ar_individual.html" dir="rtl">
            <span class="badge">عربي</span>
            <h2>فردي</h2>
            <p>تحويل الأموال &ndash; فردي</p>
        </a>
    </div>

    <footer>Dukhan Bank &middot; E-Forms</footer>

</body>
</html>
